name: release

# Runs for the version tag release-please creates when the release pull request
# merges. The GitHub release already exists as a prerelease. This workflow
# attaches the archive and its checksum, then promotes the release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  state:
    name: release state
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      state: ${{ steps.state.outputs.state }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Promoted means not a prerelease and both assets present. Anything else
      # is unfinished and is marked a prerelease again before the build.
      - name: Read the release and keep an unfinished one a prerelease
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_publish.py state --tag "$GITHUB_REF_NAME"

  release:
    name: release
    needs: state
    if: needs.state.outputs.state == 'unfinished'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a master ancestor and the version bump
        run: |
          set -euo pipefail
          git fetch origin master
          python3 .github/scripts/check_version_tag.py --tag "$GITHUB_REF_NAME" --require-master

      - name: Require the version tag to be the changelog cutoff
        run: |
          set -euo pipefail
          tag="$(bash quarkus/build/generate-changelog.sh print-tag "$GITHUB_WORKSPACE")"
          if [[ "$tag" != "$GITHUB_REF_NAME" ]]; then
            echo "changelog tag is ${tag}, expected ${GITHUB_REF_NAME}"
            exit 1
          fi

      # jsonlink and serial-impl come from the published io.freedriver.version packages,
      # the same source ci.yml verifies. The MQTT contract jar is not published.
      - name: Check out freedriver-web at the pin and confirm it is on main
        run: bash scripts/checkout-pinned-commit.sh freedriver-web.sha freedriver-web https://github.com/kazetsukaimiko/freedriver-web.git main

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: temurin
          cache: maven
          cache-dependency-path: |
            pom.xml
            freedriver-web/pom.xml

      # This step is the same text as in ci.yml. test_workflow_contract.py compares them.
      # Maven on GitHub Packages is repository-scoped, so this repository's GITHUB_TOKEN
      # cannot read freedriver's packages. FREEDRIVER_PACKAGES_TOKEN can, and it has a wider
      # scope than this read, so it is used in this step only. The step runs from
      # runner.temp, outside the checkout, so no pom, plugin, extension or script from this
      # branch runs while the token is set. Maven reads it from the environment through
      # ${env.FREEDRIVER_PACKAGES_TOKEN} in a temporary settings file; the token itself is
      # never written to disk. Later steps resolve these artifacts from the local
      # repository with no token, and a freedriver artifact missing from this list fails
      # there instead of being fetched.
      - name: Fetch the freedriver release artifacts from GitHub Packages
        working-directory: ${{ runner.temp }}
        env:
          FREEDRIVER_PACKAGES_TOKEN: ${{ secrets.FREEDRIVER_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FREEDRIVER_PACKAGES_TOKEN}" ]; then
            echo "FREEDRIVER_PACKAGES_TOKEN is not available to this run (fork pull requests get no secrets)."
            exit 1
          fi
          version="$(sed -n 's:.*<io.freedriver.version>\(.*\)</io.freedriver.version>.*:\1:p' "${GITHUB_WORKSPACE}/pom.xml")"
          case "${version}" in
            ''|*SNAPSHOT*) echo "io.freedriver.version must be a release, got '${version}'"; exit 1 ;;
          esac
          settings="$(mktemp "${RUNNER_TEMP}/freedriver-settings.XXXXXX")"
          trap 'rm -f "${settings}"' EXIT
          cat > "${settings}" <<'XML'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>kazetsukaimiko</username>
                <password>${env.FREEDRIVER_PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
          for coordinate in \
            freedriver-bom:pom freedriver-3p-bom:pom \
            jsonlink:jar serial-impl:jar victron:jar victron-jpa:jar \
            math-jpa:jar inotify-cdi:jar metrics:jar; do
            mvn --batch-mode --no-transfer-progress --settings "${settings}" \
              -Dmaven.repo.local="${HOME}/.m2/repository" \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
              -DremoteRepositories=github::default::https://maven.pkg.github.com/kazetsukaimiko/freedriver \
              -Dartifact="io.freedriver:${coordinate%%:*}:${version}:${coordinate##*:}" \
              -Dtransitive=true
          done

      - name: Install freedriver-mqtt-contract from the pinned freedriver-web commit
        working-directory: freedriver-web
        run: ./mvnw --batch-mode --no-transfer-progress -pl mqtt-contract -am install -DskipTests

      # The tagged commit already passed Maven verify on master. Package skips
      # tests and the install phase, so the runner home is not a deploy target.
      - name: Package the fast-jar
        run: |
          set -euo pipefail
          scratch_home="${GITHUB_WORKSPACE}/ci-scratch/home"
          scratch_state="${GITHUB_WORKSPACE}/ci-scratch/state"
          mkdir -p "${scratch_home}" "${scratch_state}"
          chmod 0700 "${scratch_home}" "${scratch_state}"
          export JAVA_TOOL_OPTIONS="-Duser.home=${scratch_home} -Dautonomy.state.dir=${scratch_state}"
          export AUTONOMY_STATE_DIR="${scratch_state}"
          export MAVEN_OPTS="-Dmaven.repo.local=${HOME}/.m2/repository"
          mvn --batch-mode --no-transfer-progress -pl quarkus -am package -DskipTests \
            -Duser.home="${scratch_home}" \
            -Dautonomy.state.dir="${scratch_state}"

      - name: Archive the app directory and write its checksum
        run: |
          set -euo pipefail
          app=quarkus/target/quarkus-app
          test -f "${app}/quarkus-run.jar"
          test -d "${app}/app"
          test -d "${app}/lib"
          mkdir -p dist
          archive="dist/autonomy-${GITHUB_REF_NAME}-quarkus-app.tar.gz"
          tar -C quarkus/target -czf "${archive}" quarkus-app
          (
            cd dist
            sha256sum "autonomy-${GITHUB_REF_NAME}-quarkus-app.tar.gz" \
              > "autonomy-${GITHUB_REF_NAME}-quarkus-app.tar.gz.sha256"
          )

      # The section release-please committed to CHANGELOG.md, then one line
      # naming the jsonlink jar in the archive.
      - name: Write release notes from the committed changelog section
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py \
            --changelog CHANGELOG.md \
            --version "${GITHUB_REF_NAME#v}" \
            --lib quarkus/target/quarkus-app/lib \
            --output dist/release-notes.md

      # create-storage-record stays off. The attestation is the GitHub
      # attestation API record that `gh attestation verify` checks.
      - name: Attest the archive and checksum
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/autonomy-${{ github.ref_name }}-quarkus-app.tar.gz*
          create-storage-record: false

      # Sets the whole release body, uploads with --clobber while the release
      # is a prerelease, and promotes it last. It reads the release again
      # first and stops when the release is already promoted.
      - name: Attach the assets to the existing release and promote it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          python3 .github/scripts/release_publish.py publish --tag "$tag" \
            --notes dist/release-notes.md \
            --archive "dist/autonomy-${tag}-quarkus-app.tar.gz" \
            --checksum "dist/autonomy-${tag}-quarkus-app.tar.gz.sha256"

  # A rerun for a release that is already promoted. It builds nothing and
  # uploads nothing. A fresh build of the same commit has other bytes, so the
  # published archive is checked against its own checksum and attestation.
  verify:
    name: verify the promoted release
    needs: state
    if: needs.state.outputs.state == 'promoted'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the published archive, checksum and attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_publish.py verify --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
