name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout autonomy
        uses: actions/checkout@v4

      - name: Test release tag rules and changelog tag selection
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bash quarkus/build/generate-changelog-test.sh

      # freedriver.sha is the jsonlink commit. freedriver-web.sha is the MQTT contract commit.
      - name: Check out freedriver at the pin and confirm it is on master
        run: bash scripts/checkout-pinned-commit.sh freedriver.sha freedriver https://github.com/kazetsukaimiko/freedriver.git master

      - name: Check out freedriver-web at the pin and confirm it is on main
        run: bash scripts/checkout-pinned-commit.sh freedriver-web.sha freedriver-web https://github.com/kazetsukaimiko/freedriver-web.git main

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: |
            pom.xml
            freedriver/pom.xml

      # Maven 3.10 rejects a duplicate dependencyManagement import that older
      # runners only warned about. The second freedriver-jakarta-bom import in
      # inotify-cdi matches the first, which is the one Maven used to keep.
      - name: Drop duplicate freedriver BOM import
        working-directory: freedriver
        run: python3 "$GITHUB_WORKSPACE/scripts/drop-duplicate-freedriver-bom.py" inotify-cdi/pom.xml

      - name: Install freedriver SNAPSHOT
        working-directory: freedriver
        run: mvn --batch-mode --no-transfer-progress install -DskipTests

      - name: Install freedriver-mqtt-contract from the pinned freedriver-web commit
        working-directory: freedriver-web
        run: ./mvnw --batch-mode --no-transfer-progress -pl mqtt-contract -am install -DskipTests

      # Full reactor, so quarkus tests run on every pull request and push to master.
      # user.home and autonomy.state.dir are scratch dirs in this workspace, not the
      # runner home. JAVA_TOOL_OPTIONS reaches Maven and forked Surefire JVMs.
      # maven.repo.local stays on the setup-java cache path.
      - name: Build, test, and Spotless check
        run: |
          set -euo pipefail
          scratch_home="${GITHUB_WORKSPACE}/ci-scratch/home"
          scratch_state="${GITHUB_WORKSPACE}/ci-scratch/state"
          case "${scratch_home}" in
            "${GITHUB_WORKSPACE}"/*) ;;
            *) echo "user.home is outside the workspace"; exit 1 ;;
          esac
          case "${scratch_state}" in
            "${GITHUB_WORKSPACE}"/*) ;;
            *) echo "autonomy state directory is outside the workspace"; exit 1 ;;
          esac
          mkdir -p "${scratch_home}" "${scratch_state}"
          chmod 0700 "${scratch_home}" "${scratch_state}"
          export JAVA_TOOL_OPTIONS="-Duser.home=${scratch_home} -Dautonomy.state.dir=${scratch_state}"
          export AUTONOMY_STATE_DIR="${scratch_state}"
          export MAVEN_OPTS="-Dmaven.repo.local=${HOME}/.m2/repository"
          echo "user.home=${scratch_home}"
          echo "autonomy.state.dir=${scratch_state}"
          mvn --batch-mode --no-transfer-progress clean verify \
            -Duser.home="${scratch_home}" \
            -Dautonomy.state.dir="${scratch_state}"
