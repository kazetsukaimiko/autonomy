# Appliance mappings and sensor history are files under ~/.config/autonomy.
# Override the mappings file with AUTONOMY_MAPPINGS_FILE.
autonomy.mappings.file=${user.home}/.config/autonomy/mappings_v2.json
# MQTT state publish stays off until autonomy.mqtt.enabled=true. Keys and an example: docs/mqtt.md.
autonomy.mqtt.enabled=false
# Command subscribe stays off unless this value is true. Any other value logs once,
# does not subscribe, and does not stop the process. This build does not set it true
# and does not set freedriver.appliances.live-commands.
autonomy.mqtt.commands-enabled=false
autonomy.mqtt.command-max-bytes=4096

# Events are stored in MongoDB. A down database must not stop the process:
# no Dev Services container, no readiness check, and a short selection timeout.
# The connection string is runtime config. This file does not set one.
quarkus.mongodb.devservices.enabled=false
quarkus.mongodb.health.enabled=false
quarkus.mongodb.database=autonomy
quarkus.mongodb.server-selection-timeout=1S
quarkus.mongodb.connect-timeout=1S
quarkus.mongodb.read-timeout=2S
