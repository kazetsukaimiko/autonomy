# Appliance mappings and sensor history are files under ~/.config/autonomy. Event writes are discarded.
# Override the mappings file with AUTONOMY_MAPPINGS_FILE.
autonomy.mappings.file=${user.home}/.config/autonomy/mappings_v2.json

# Saved on/off state for every appliance. This directory sits outside the deployed
# build (~/.local/autonomy-next) so deploys and rollbacks leave it alone.
# The file inside it is appliance-state.json.
# Override with AUTONOMY_STATE_DIR, for example to mount the directory as a Docker volume.
autonomy.state.dir=${user.home}/.local/share/autonomy
# Quarkus tests read and write this directory instead of the real state directory.
%test.autonomy.state.dir=${java.io.tmpdir}/autonomy-quarkus-test

# Each board is restored at most once inside this window. A reconnect inside the
# window is logged and restored once when the window ends.
# Override with AUTONOMY_STATE_RESTORE_WINDOW (a duration such as 30s).
autonomy.state.restore-window=30s
